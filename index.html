<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="可离线使用的 JSON 编辑与文本对比工具">
  <meta name="theme-color" content="#10bf88">
  <title>JSON 看板</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="./favicon.png" type="image/png" sizes="128x128">
  <link rel="apple-touch-icon" href="./favicon.png">
  <link rel="stylesheet" href="./styles.css?v=20260903-5">
</head>
<body>
  <main class="app" aria-label="JSON 看板">
    <header class="toolbar" aria-label="编辑器工具栏">
      <div class="tool-actions">
        <button class="icon-button" type="button" data-action="line-numbers" title="显示行号" aria-label="显示行号" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10M4 5h1v3M4 11h2l-2 3h2M4 17h2l-2 3h2"/></svg>
        </button>
        <button class="icon-button" type="button" data-action="hide-null" title="隐藏 null 值" aria-label="隐藏值为 null 的键值" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 10.7a2 2 0 0 0 2.7 2.7M9.9 4.2A10.6 10.6 0 0 1 12 4c5.5 0 9 5 9 5a15.8 15.8 0 0 1-2.1 2.6M6.6 6.7C4.3 8.2 3 10 3 10s3.5 5 9 5a9.9 9.9 0 0 0 3-.5"/></svg>
        </button>
        <button class="icon-button" type="button" data-action="copy" title="复制" aria-label="复制当前文本">
          <svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="12" rx="1"/><path d="M16 8V4H5v12h3"/></svg>
        </button>
        <button class="icon-button" type="button" data-action="collapse-all" title="折叠全部" aria-label="折叠除最外层外的所有片段">
          <svg viewBox="0 0 24 24"><path d="M5 8h14M5 16h14M8 5l4 4 4-4M8 19l4-4 4 4"/></svg>
        </button>
        <button class="icon-button" type="button" data-action="expand-all" title="展开全部" aria-label="展开所有片段">
          <svg viewBox="0 0 24 24"><path d="M5 5h14v14H5zM8 12h8M12 8v8"/></svg>
        </button>
        <button class="icon-button" type="button" data-action="replace" title="查找替换（Ctrl + H / ⌘⌥F）" aria-label="打开查找替换" aria-pressed="false">
          <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4M6 19h7M10.5 16.5 13 19l-2.5 2.5"/></svg>
        </button>
        <button class="code-mode-button" type="button" data-action="code-mode" title="代码模式（自动识别语言）" aria-label="开启代码模式" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>
          <span>代码模式</span>
        </button>
        <span id="languageBadge" class="language-badge" title="自动识别到的语言" hidden>纯文本</span>
        <button class="format-json-button" type="button" data-action="format" title="格式化 JSON（⌘/Ctrl + Enter）" aria-label="格式化 JSON">
          <svg viewBox="0 0 24 24"><path d="M8 4H5a2 2 0 0 0-2 2v3M16 4h3a2 2 0 0 1 2 2v3M8 20H5a2 2 0 0 1-2-2v-3M16 20h3a2 2 0 0 0 2-2v-3M9 8l-2 4 2 4M15 8l2 4-2 4"/></svg>
          <span>格式化 JSON</span>
        </button>
        <button class="compare-mode-button" type="button" data-action="compare" title="文本对比" aria-label="进入文本对比模式" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M8 5H4v14h4M16 5h4v14h-4M9 9l3-3 3 3M15 15l-3 3-3-3M12 6v12"/></svg>
          <span>文本对比</span>
        </button>
      </div>

      <div id="compareSummary" class="compare-summary" hidden>
        <div class="compare-heading">
          <span class="compare-heading-dot"></span>
          <strong>新文本</strong>
          <span id="diffMessage">粘贴文本后自动对比</span>
        </div>
        <div class="diff-navigation" aria-label="差异导航">
          <button id="previousChange" type="button" title="上一处变更" aria-label="跳到上一处变更" disabled>
            <svg viewBox="0 0 20 20"><path d="m5 12 5-5 5 5"/></svg>
          </button>
          <span id="changePosition">0 / 0</span>
          <button id="nextChange" type="button" title="下一处变更" aria-label="跳到下一处变更" disabled>
            <svg viewBox="0 0 20 20"><path d="m5 8 5 5 5-5"/></svg>
          </button>
        </div>
        <div class="diff-stats" aria-live="polite">
          <span class="diff-stat added"><i></i><b id="addedCount">0</b> 新增</span>
          <span class="diff-stat removed"><i></i><b id="removedCount">0</b> 删除</span>
          <span class="diff-stat modified"><i></i><b id="modifiedCount">0</b> 修改</span>
        </div>
      </div>

    </header>

    <section id="replacePanel" class="replace-panel" role="dialog" aria-label="查找替换" hidden>
      <div class="replace-panel-heading">
        <strong>查找替换</strong>
        <span id="replaceTarget">当前文本</span>
        <button id="closeReplace" class="replace-close" type="button" title="关闭" aria-label="关闭查找替换">
          <svg viewBox="0 0 20 20"><path d="m5 5 10 10M15 5 5 15"/></svg>
        </button>
      </div>
      <div class="replace-field search-field">
        <label for="findText">查找</label>
        <input id="findText" type="text" autocomplete="off" spellcheck="false" placeholder="输入要查找的文本">
        <span id="findPosition" aria-live="polite">0 / 0</span>
        <button id="previousMatch" type="button" title="上一处" aria-label="上一处匹配">
          <svg viewBox="0 0 20 20"><path d="m5 12 5-5 5 5"/></svg>
        </button>
        <button id="nextMatch" type="button" title="下一处" aria-label="下一处匹配">
          <svg viewBox="0 0 20 20"><path d="m5 8 5 5 5-5"/></svg>
        </button>
      </div>
      <div class="replace-field">
        <label for="replaceText">替换</label>
        <input id="replaceText" type="text" autocomplete="off" spellcheck="false" placeholder="输入替换后的文本">
        <button id="replaceCurrent" class="replace-action" type="button">替换</button>
        <button id="replaceAll" class="replace-action primary" type="button">全部替换</button>
      </div>
    </section>

    <section id="workspace" class="workspace" aria-label="文本编辑区域">
      <section class="editor-pane primary-pane" aria-label="当前文本">
        <div id="lineNumbers" class="line-numbers" aria-hidden="true"></div>
        <div class="code-stage">
          <div class="diff-backdrop" aria-hidden="true"><div id="leftDiffLines" class="diff-lines"></div></div>
          <div id="primarySearchHighlights" class="search-highlights" aria-hidden="true"></div>
          <div id="foldControls" class="fold-controls" aria-label="JSON 折叠控件"></div>
          <pre id="primaryHighlight" class="syntax-layer" aria-hidden="true"></pre>
          <textarea id="jsonInput" aria-label="请输入 JSON 或代码文本" placeholder="请输入 JSON 数据…" spellcheck="false"></textarea>
        </div>
      </section>

      <div id="splitter" class="splitter" role="separator" aria-label="拖动调整左右宽度" aria-orientation="vertical" tabindex="0" hidden></div>

      <section id="comparePane" class="editor-pane compare-pane" aria-label="新文本" hidden>
        <div id="compareLineNumbers" class="line-numbers" aria-hidden="true"></div>
        <div class="code-stage">
          <div class="diff-backdrop" aria-hidden="true"><div id="rightDiffLines" class="diff-lines"></div></div>
          <div id="compareSearchHighlights" class="search-highlights" aria-hidden="true"></div>
          <pre id="compareHighlight" class="syntax-layer" aria-hidden="true"></pre>
          <textarea id="compareInput" aria-label="粘贴需要对比的新文本" placeholder="粘贴需要对比的新文本…" spellcheck="false"></textarea>
        </div>
      </section>
    </section>

    <aside id="errorCard" class="error-card" role="alert" hidden>
      <div class="error-card-icon" aria-hidden="true">!</div>
      <div class="error-card-body">
        <div class="error-card-heading">
          <strong>JSON 格式有问题</strong>
          <span id="errorLocation"></span>
        </div>
        <p id="errorMessage"></p>
        <p id="errorSuggestion"></p>
        <button id="locateError" type="button">定位到问题</button>
      </div>
      <button id="closeErrorCard" class="error-card-close" type="button" title="暂时关闭提示" aria-label="暂时关闭提示">
        <svg viewBox="0 0 20 20"><path d="m5 5 10 10M15 5 5 15"/></svg>
      </button>
    </aside>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="./vendor/highlight.min.js?v=11.11.1"></script>
  <script src="./json-diagnostics.js?v=20260903-3"></script>
  <script src="./editor-utils.js?v=20260903-3"></script>
  <script src="./diff-utils.js?v=20260903-3"></script>
  <script src="./app.js?v=20260903-6"></script>
</body>
</html>
